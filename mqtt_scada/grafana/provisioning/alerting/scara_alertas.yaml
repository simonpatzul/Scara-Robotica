# Alertas del SCARA. Se ven en Alerting > Alert rules y en el panel 'Alertas activas' del dashboard.
# Para que lleguen por correo o Telegram hay que agregar un contact point en Grafana (no viene incluido).
apiVersion: 1
groups:
  - orgId: 1
    name: scara
    folder: SCARA
    interval: 10s
    rules:
      - uid: scara-sobrecorriente
        title: Sobrecorriente en un motor
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: scara-pg
            model:
              refId: A
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT COALESCE(max(GREATEST(r1_i, r2_i, p_i)), 0)::float AS i FROM telemetria WHERE ts > now() - interval '10 seconds'"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [3]}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Algún motor pasó de 3 A en los últimos 10 s. Revisa si está trabado o tocando un final."
        labels:
          severidad: critical
      - uid: scara-falla
        title: Falla de corriente del STM32
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: scara-pg
            model:
              refId: A
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT count(*)::float AS n FROM eventos WHERE ts > now() - interval '1 minute'"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "El STM32 registró una falla (sostenida o pico) en el último minuto. Ver tabla de fallas."
        labels:
          severidad: critical
      - uid: scara-sin-datos
        title: El STM32 no manda datos
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: scara-pg
            model:
              refId: A
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT COALESCE(EXTRACT(EPOCH FROM now() - max(ts)), 99999)::float AS s FROM telemetria"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [5]}
        noDataState: Alerting
        execErrState: Error
        for: 0s
        annotations:
          summary: "Más de 5 s sin scara/estado: STM32 apagado, sin WiFi o server.js detenido."
        labels:
          severidad: critical
      - uid: scara-parado
        title: Robot parado desde el SCADA
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: scara-pg
            model:
              refId: A
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT COALESCE((SELECT CASE WHEN ciclo = 'PARADO' THEN 1 ELSE 0 END FROM telemetria ORDER BY ts DESC LIMIT 1), 0)::float AS parado"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Los EN de los drivers están apagados. Aprieta PRENDER para seguir."
        labels:
          severidad: warning
      - uid: scara-rechazado
        title: Comando rechazado
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: scara-pg
            model:
              refId: A
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT count(*)::float AS n FROM comandos WHERE origen = 'respuesta' AND texto LIKE 'pc: rechazado%' AND ts > now() - interval '30 seconds'"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "El PC rechazó un comando de movimiento (fuera de alcance, robot parado o sin Home)."
        labels:
          severidad: info
